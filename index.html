<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ควิซรวม: เครื่องมือวัดไฟฟ้า</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
  --accent:#4f46e5; --accent2:#7c3aed; --correct:#16a34a; --wrong:#dc2626;
  --border:#e5e7eb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111319; --card:#1a1d27; --text:#eef0f5; --muted:#9aa0ac;
    --accent:#818cf8; --accent2:#a78bfa; --correct:#4ade80; --wrong:#f87171;
    --border:#2a2e3a;
  }
}
:root[data-theme="dark"]{
  --bg:#111319; --card:#1a1d27; --text:#eef0f5; --muted:#9aa0ac;
  --accent:#818cf8; --accent2:#a78bfa; --correct:#4ade80; --wrong:#f87171;
  --border:#2a2e3a;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.35rem;margin:8px 0 2px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
button{
  font:inherit;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600;transition:opacity .15s;
}
button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button:hover{opacity:.88;}
button:disabled{opacity:.4;cursor:not-allowed;}
.progress{width:100%;height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s;}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:6px;}
.qtext{font-size:1.08rem;font-weight:600;margin:6px 0 16px;line-height:1.5;}
.opt{
  display:block;width:100%;text-align:left;background:var(--bg);
  border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;
  font-size:.98rem;color:var(--text);cursor:pointer;transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{border-color:var(--correct);background:color-mix(in srgb, var(--correct) 16%, var(--card));}
.opt.wrong{border-color:var(--wrong);background:color-mix(in srgb, var(--wrong) 16%, var(--card));}
.opt:disabled{cursor:default;}
.explain{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:.9rem;color:var(--muted);border:1px dashed var(--border);}
.footer-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
.score{font-size:2.4rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.center{text-align:center;}
.reviewitem{border-bottom:1px solid var(--border);padding:10px 0;font-size:.92rem;}
.reviewitem:last-child{border-bottom:none;}
.tag-ok{color:var(--correct);font-weight:700;}
.tag-no{color:var(--wrong);font-weight:700;}
.topic-card{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:left; background:var(--card); border:1.5px solid var(--border);
  border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; color:var(--text);
  transition:border-color .15s, transform .1s;
}
.topic-card:hover{border-color:var(--accent); transform:translateY(-1px);}
.topic-card .ttitle{font-weight:700; font-size:1.02rem;}
.topic-card .tsub{color:var(--muted); font-size:.85rem; margin-top:3px;}
.topic-card .tcount{background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:.78rem; color:var(--muted); white-space:nowrap;}
.mode-row{display:flex; gap:8px; margin:6px 0 18px;}
.mode-row button{flex:1;}
.backlink{background:transparent;color:var(--muted);border:none;padding:6px 0;font-weight:600;font-size:.88rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧮 ควิซรวม: เครื่องมือวัดไฟฟ้า</h1>
  <div class="sub">เลือกบทที่ต้องการทำ — บทละ 20 ข้อ พร้อมเฉลยและคำอธิบาย</div>

  <div id="topic-screen">
    <div class="mode-row">
      <button id="btn-all-order">ทำทุกบทรวมกัน (เรียงลำดับ)</button>
      <button id="btn-all-shuffle" class="secondary">ทำทุกบทรวมกัน (สุ่ม)</button>
    </div>
    <div id="topic-list"></div>
  </div>

  <div id="topic-detail" class="card" style="display:none;">
    <button class="backlink" id="btn-back-topics">← กลับไปเลือกบท</button>
    <h1 id="td-title" style="margin-top:4px;"></h1>
    <div class="sub" id="td-sub"></div>
    <div class="toolbar">
      <button id="btn-start">เริ่มทำ (เรียงลำดับ)</button>
      <button id="btn-shuffle" class="secondary">สุ่มลำดับ แล้วเริ่ม</button>
    </div>
  </div>

  <div id="quiz-screen" class="card" style="display:none;">
    <div class="qmeta"><span id="q-topic-label"></span><span id="q-score"></span></div>
    <div class="progress"><div id="progress-bar" style="width:0%"></div></div>
    <div class="qmeta"><span id="q-index"></span><span></span></div>
    <div class="qtext" id="q-text"></div>
    <div id="q-options"></div>
    <div id="q-explain" class="explain" style="display:none;"></div>
    <div class="footer-nav">
      <button class="secondary" id="btn-quit">ออกจากควิซ</button>
      <button id="btn-next" disabled>ข้อถัดไป</button>
    </div>
  </div>

  <div id="result-screen" class="card center" style="display:none;">
    <div class="score" id="final-score"></div>
    <p style="color:var(--muted)" id="final-text"></p>
    <div class="toolbar" style="justify-content:center;">
      <button id="btn-restart">ทำบทนี้ใหม่</button>
      <button id="btn-back-topics2" class="secondary">กลับไปเลือกบท</button>
    </div>
    <div id="review" style="text-align:left;margin-top:14px;"></div>
  </div>
</div>

<script>
const TOPICS = [{"key": "ohmmeter", "title": "โอห์มมิเตอร์", "sub": "แบบอนุกรมและแบบชันต์", "questions": [{"q": "ในโอห์มมิเตอร์แบบอนุกรม (series type) เมื่อลัดวงจรขั้ว A และ B (Rx=0) จะเกิดอะไรขึ้น", "options": ["กระแสไหลสูงสุด เข็มขึ้นเต็มสเกล (จุด 0Ω)", "ไม่มีกระแสไหล เข็มไม่ขึ้น", "กระแสไหลครึ่งสเกล", "เข็มสั่นไม่นิ่ง"], "correct": 0, "explain": "เมื่อ Rx=0 กระแสไหลสูงสุด ใช้ปรับ R2 ให้เข็มขึ้นเต็มสเกล กำหนดเป็นจุด 0 โอห์ม"}, {"q": "ในโอห์มมิเตอร์แบบอนุกรม เมื่อ A และ B เปิดวงจร (Rx=∞) กระแสผ่านมิเตอร์เป็นเท่าใด", "options": ["เท่ากับ Ifsd", "ครึ่งหนึ่งของ Ifsd", "ศูนย์", "ไม่สามารถระบุได้"], "correct": 2, "explain": "Rx=∞ ไม่มีกระแสไหลในวงจร เข็มไม่เบี่ยงเบน กำหนดเป็นจุด ∞ โอห์ม"}, {"q": "สาเหตุหลักที่ทำให้กระแสเบี่ยงเบนเต็มสเกล (full-scale) ของโอห์มมิเตอร์แบบอนุกรมลดลงเมื่อเวลาผ่านไปคืออะไร", "options": ["ค่า R1 เปลี่ยน", "แรงดันแบตเตอรี่ภายในลดลงตามอายุการใช้งาน", "อุณหภูมิห้องสูงขึ้น", "ขดลวดเคลื่อนที่เสียหาย"], "correct": 1, "explain": "แบตเตอรี่เสื่อมตามเวลา แรงดันลดลง ทำให้กระแสเต็มสเกลไม่ตรงกับจุด 0Ω เดิม"}, {"q": "การชดเชยแรงดันแบตเตอรี่ที่ตกในโอห์มมิเตอร์แบบอนุกรม ควรปรับตัวต้านทานตัวใดจึงจะไม่กระทบการสเกล", "options": ["ปรับ R1", "ปรับ R2 (shunt)", "ปรับ Rm", "ปรับ Rx"], "correct": 1, "explain": "การปรับ R2 (ชันต์ขนานกับมิเตอร์) ดีกว่าเพราะไม่กระทบการคาลิเบรตสเกลเหมือนปรับ R1"}, {"q": "สูตรความต้านทานครึ่งสเกล (Rh) ของโอห์มมิเตอร์แบบอนุกรมคือข้อใด", "options": ["Rh = R1 + (R2 ขนาน Rm)", "Rh = R1 × R2", "Rh = R2 - Rm", "Rh = R1/R2"], "correct": 0, "explain": "Rh = R1 + (R2//Rm) คือความต้านทานภายในของโอห์มมิเตอร์ที่ทำให้เข็มขึ้นครึ่งสเกล"}, {"q": "บนสเกลหน้าปัดของโอห์มมิเตอร์แบบอนุกรม จุด \"0\" โอห์ม อยู่ด้านใด", "options": ["ด้านซ้ายสุด", "ด้านขวาสุด", "อยู่กึ่งกลาง", "ไม่แน่นอน"], "correct": 1, "explain": "จุด 0Ω อยู่ด้านขวา (full scale deflection) ส่วน ∞ อยู่ด้านซ้าย"}, {"q": "บนสเกลหน้าปัดของโอห์มมิเตอร์แบบอนุกรม จุด \"∞\" โอห์ม อยู่ด้านใด", "options": ["ด้านขวาสุด", "ด้านซ้ายสุด", "อยู่กึ่งกลาง", "ไม่ปรากฏบนสเกล"], "correct": 1, "explain": "จุด ∞ อย let currentTopicIdx = null; // null = "all"
let order = [];
let pool = [];
let idx = 0;
let score = 0;
let answers = [];
let answered = false;
let lastShuffle = false;

const topicScreen = document.getElementById('topic-screen');
const topicDetail = document.getElementById('topic-detail');
const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');

function renderTopicList(){
  const list = document.getElementById('topic-list');
  list.innerHTML = '';
  TOPICS.forEach((t, i)=>{
    const div = document.createElement('div');
    div.className = 'topic-card';
    div.innerHTML = '<div><div class="ttitle">'+(i+1)+'. '+t.title+'</div><div class="tsub">'+t.sub+'</div></div><div class="tcount">'+t.questions.length+' ข้อ</div>';
    div.onclick = ()=>openTopicDetail(i);
    list.appendChild(div);
  });
}

function openTopicDetail(i){
  currentTopicIdx = i;
  topicScreen.style.display='none';
  topicDetail.style.display='block';
  document.getElementById('td-title').textContent = TOPICS[i].title;
  document.getElementById('td-sub').textContent = TOPICS[i].sub + ' · ' + TOPICS[i].questions.length + ' ข้อ';
}

document.getElementById('btn-back-topics').onclick = ()=>{
  topicDetail.style.display='none';
  topicScreen.style.display='block';
};
document.getElementById('btn-back-topics2').onclick = ()=>{
  resultScreen.style.display='none';
  topicScreen.style.display='block';
};

function shuffleArr(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildPool(){
  if(currentTopicIdx===null){
    // all topics combined, tag each question with topic title
    pool = [];
    TOPICS.forEach(t=>{
      t.questions.forEach(q=>pool.push(Object.assign({}, q, {topic:t.title})));
    });
  } else {
    const t = TOPICS[currentTopicIdx];
    pool = t.questions.map(q=>Object.assign({}, q, {topic:t.title}));
  }
}

function beginQuiz(shuffle){
  lastShuffle = shuffle;
  buildPool();
  order = shuffle ? shuffleArr(pool.map((_,i)=>i)) : pool.map((_,i)=>i);
  idx = 0; score = 0; answered = false; answers = [];
  topicScreen.style.display='none';
  topicDetail.style.display='none';
  resultScreen.style.display='none';
  quizScreen.style.display='block';
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const qi = order[idx];
  const q = pool[qi];
  document.getElementById('q-topic-label').textContent = q.topic;
  document.getElementById('progress-bar').style.width = (idx/pool.length*100)+'%';
  document.getElementById('q-index').textContent = 'ข้อ ' + (idx+1) + ' / ' + pool.length;
  document.getElementById('q-score').textContent = 'คะแนน: ' + score;
  document.getElementById('q-text').textContent = q.q;
  const optWrap = document.getElementById('q-options');
  optWrap.innerHTML = '';
  const optOrder = shuffleArr(q.options.map((_,i)=>i));
  optOrder.forEach(oi=>{
    const b = document.createElement('button');
    b.className='opt';
    b.textContent = q.options[oi];
    b.onclick = ()=>selectOption(oi, b, q, optWrap);
    optWrap.appendChild(b);
  });
  document.getElementById('q-explain').style.display='none';
  document.getElementById('btn-next').disabled = true;
  document.getElementById('btn-next').textContent = (idx===pool.length-1) ? 'ดูผลคะแนน' : 'ข้อถัดไป';
}

function selectOption(oi, btn, q, optWrap){
  if(answered) return;
  answered = true;
  const isCorrect = oi === q.correct;
  if(isCorrect) score++;
  answers.push({q:q.q, topic:q.topic, picked:q.options[oi], correctText:q.options[q.correct], ok:isCorrect});
  Array.from(optWrap.children).forEach(child=>{
    child.disabled = true;
    if(child.textContent === q.options[q.correct]) child.classList.add('correct');
  });
  if(!isCorrect) btn.classList.add('wrong');
  const ex = document.getElementById('q-explain');
  ex.style.display='block';
  ex.textContent = (isCorrect?'ถูกต้อง! ':'ยังไม่ถูก ') + (q.explain || '');
  document.getElementById('q-score').textContent = 'คะแนน: ' + score;
  document.getElementById('btn-next').disabled = false;
}

document.getElementById('btn-next').onclick = ()=>{
  if(idx < pool.length-1){
    idx++;
    renderQuestion();
  } else {
    showResult();
  }
};

document.getElementById('btn-quit').onclick = ()=>{
  quizScreen.style.display='none';
  topicScreen.style.display='block';
};

function showResult(){
  quizScreen.style.display='none';
  resultScreen.style.display='block';
  document.getElementById('final-score').textContent = score + ' / ' + pool.length;
  const pct = Math.round(score/pool.length*100);
  document.getElementById('final-text').textContent = 'คิดเป็น ' + pct + '%';
  const rev = document.getElementById('review');
  rev.innerHTML = '<hr style="border-color:var(--border);margin:14px 0;">' + answers.map((a,i)=>{
    return '<div class="reviewitem"><b>'+(i+1)+'. ['+a.topic+'] '+a.q+'</b><br>'+
      (a.ok?'<span class="tag-ok">✓ ตอบถูก: '+a.correctText+'</span>'
           :'<span class="tag-no">✗ คุณตอบ: '+a.picked+'</span> — เฉลย: '+a.correctText)+
      '</div>';
  }).join('');
}

document.getElementById('btn-start').onclick = ()=>beginQuiz(false);
document.getElementById('btn-shuffle').onclick = ()=>beginQuiz(true);
document.getElementById('btn-restart').onclick = ()=>beginQuiz(lastShuffle);
document.getElementById('btn-all-order').onclick = ()=>{ currentTopicIdx=null; beginQuiz(false); };
document.getElementById('btn-all-shuffle').onclick = ()=>{ currentTopicIdx=null; beginQuiz(true); };

renderTopicList();
</script>
</body>
</html>
