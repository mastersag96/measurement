<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>529300 · เครื่องมือวัดไฟฟ้า Quiz Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0f0c;
    --panel: #10160f;
    --panel-2: #141c13;
    --grid-line: rgba(78,222,152,0.08);
    --phosphor: #4ade80;
    --phosphor-dim: #2d6e47;
    --amber: #f5a524;
    --red: #f56565;
    --ink: #d7f5df;
    --ink-dim: #7fa389;
    --mono: 'IBM Plex Mono', monospace;
    --thai: 'Noto Sans Thai', 'Noto Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(78,222,152,0.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--thai);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ---- Header: instrument faceplate ---- */
  .faceplate{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid rgba(78,222,152,0.18);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .faceplate::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:16px 16px;
    pointer-events:none;
  }
  .faceplate-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; position:relative;}
  .brand{font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--ink-dim); text-transform:uppercase;}
  .title{font-family:var(--mono); font-weight:600; font-size:15px; color:var(--phosphor); margin-top:4px; letter-spacing:0.02em;}
  .subtitle{font-size:12.5px; color:var(--ink-dim); margin-top:4px;}
  .led{width:8px;height:8px;border-radius:50%;background:var(--phosphor); box-shadow:0 0 8px var(--phosphor); display:inline-block; margin-right:6px; animation:blink 2.4s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .readout{
    font-family:var(--mono);
    background:#050805;
    border:1px solid rgba(78,222,152,0.25);
    border-radius:6px;
    padding:8px 12px;
    text-align:right;
    min-width:118px;
  }
  .readout .val{font-size:22px; color:var(--phosphor); text-shadow:0 0 10px rgba(78,222,152,0.5); line-height:1.1;}
  .readout .lbl{font-size:9.5px; color:var(--ink-dim); letter-spacing:0.12em; text-transform:uppercase;}

  /* ---- Nav grid (quiz navigation) ---- */
  .nav-panel{
    background:var(--panel);
    border:1px solid rgba(78,222,152,0.12);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .nav-panel-title{font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .nav-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(34px,1fr)); gap:6px;}
  .nav-btn{
    font-family:var(--mono); font-size:12px; font-weight:600;
    background:#0d130c; color:var(--ink-dim);
    border:1px solid rgba(127,163,137,0.25);
    border-radius:5px; padding:7px 0; cursor:pointer;
    transition:all .12s ease;
  }
  .nav-btn:hover{border-color:var(--phosphor);}
  .nav-btn.current{outline:2px solid var(--amber); outline-offset:1px;}
  .nav-btn.answered-correct{background:rgba(78,222,152,0.16); color:var(--phosphor); border-color:var(--phosphor-dim);}
  .nav-btn.answered-wrong{background:rgba(245,101,101,0.14); color:var(--red); border-color:rgba(245,101,101,0.4);}
  .nav-btn.skipped{background:rgba(245,165,36,0.12); color:var(--amber); border-color:rgba(245,165,36,0.35);}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .btn{
    font-family:var(--thai); font-size:13px; font-weight:600;
    padding:9px 14px; border-radius:7px; cursor:pointer; border:1px solid transparent;
    transition:all .12s ease;
  }
  .btn-ghost{background:transparent; border-color:rgba(127,163,137,0.35); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--phosphor);}
  .btn-solid{background:var(--phosphor); color:#052712;}
  .btn-solid:hover{background:#5aeb90;}
  .btn-solid:disabled{opacity:0.35; cursor:not-allowed;}

  /* ---- Question card (scope screen) ---- */
  .screen{
    background:radial-gradient(circle at 50% 0%, rgba(78,222,152,0.05), transparent 70%), #060a06;
    border:1px solid rgba(78,222,152,0.22);
    border-radius:12px;
    padding:22px 22px 20px;
    position:relative;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
  }
  .qmeta{font-family:var(--mono); font-size:11px; color:var(--phosphor-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:10px; display:flex; justify-content:space-between;}
  .qtext{font-size:16.5px; line-height:1.6; color:var(--ink); margin-bottom:18px; font-weight:500;}
  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--panel); border:1px solid rgba(127,163,137,0.25);
    border-radius:8px; padding:11px 13px; cursor:pointer;
    font-size:14.5px; line-height:1.5; transition:all .12s ease;
  }
  .opt:hover{border-color:var(--phosphor); background:#131c11;}
  .opt .tag{font-family:var(--mono); font-weight:700; color:var(--ink-dim); min-width:18px;}
  .opt.selected{border-color:var(--amber); background:rgba(245,165,36,0.08);}
  .opt.correct{border-color:var(--phosphor); background:rgba(78,222,152,0.12);}
  .opt.correct .tag{color:var(--phosphor);}
  .opt.wrong{border-color:var(--red); background:rgba(245,101,101,0.1);}
  .opt.wrong .tag{color:var(--red);}
  .opt.disabled{cursor:default;}
  .opt.disabled:hover{background:var(--panel);}

  .feedback{font-family:var(--mono); font-size:12px; margin-top:12px; min-height:16px;}
  .feedback.ok{color:var(--phosphor);}
  .feedback.bad{color:var(--red);}

  .footer-nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:8px;}

  /* ---- Result screen ---- */
  .result{text-align:center; padding:10px 0 4px;}
  .result .big{font-family:var(--mono); font-size:48px; color:var(--phosphor); text-shadow:0 0 16px rgba(78,222,152,0.5);}
  .result .sub{color:var(--ink-dim); font-size:13px; margin-top:4px; margin-bottom:18px;}
  .review-list{text-align:left; display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .review-item{background:var(--panel); border:1px solid rgba(127,163,137,0.2); border-radius:8px; padding:10px 12px; font-size:13px;}
  .review-item.wrong{border-color:rgba(245,101,101,0.35);}
  .review-item .q{color:var(--ink); margin-bottom:4px;}
  .review-item .a{font-family:var(--mono); font-size:12px;}
  .review-item .a.ok{color:var(--phosphor);}
  .review-item .a.bad{color:var(--red);}

  .hint{font-size:11.5px; color:var(--ink-dim); text-align:center; margin-top:14px; line-height:1.6;}
  a.credit{color:var(--ink-dim);}
</style>
</head>
<body>
<div class="wrap">

  <div class="faceplate">
    <div class="faceplate-top">
      <div>
        <div class="brand"><span class="led"></span>SUT · 529300 ELECTRICAL INSTRUMENTS &amp; MEASUREMENTS</div>
        <div class="title">Midterm Review Bench</div>
        <div class="subtitle">แบบทดสอบทบทวนจากข้อสอบกลางภาคชุดที่ 1 · สุ่มข้อ / ข้ามข้อได้อิสระ</div>
      </div>
      <div class="readout">
        <div class="val" id="scoreReadout">0/0</div>
        <div class="lbl">score</div>
      </div>
    </div>
  </div>

  <div class="nav-panel">
    <div class="nav-panel-title">
      <span>Quiz Navigation</span>
      <span id="progressLabel">0 / 0 answered</span>
    </div>
    <div class="nav-grid" id="navGrid"></div>
    <div class="toolbar">
      <button class="btn btn-ghost" id="shuffleBtn">🔀 สุ่มลำดับข้อใหม่</button>
      <button class="btn btn-ghost" id="resetBtn">↺ เริ่มทำใหม่ (ลำดับเดิม)</button>
      <button class="btn btn-solid" id="finishBtn">✓ ส่งคำตอบ / ดูผล</button>
    </div>
  </div>

  <div id="quizArea"></div>

  <div class="hint">ข้อมูลคำถามและตัวเลือกทั้งหมดดึงมาจากไฟล์ข้อสอบกลางภาคชุดที่ 1 วิชา 529300 ที่อัปโหลดเท่านั้น</div>
</div>

<script>
const QUESTIONS = [
{q:"ข้อใด ตรงกับ Gaussian law (normal law) ของความผิดพลาดสุ่ม ?",
 o:["ความผิดพลาดสุ่มมีค่าน้อย","ความผิดพลาดสุ่มมีค่าเฉลี่ยที่ไม่เท่ากับศูนย์","ความผิดพลาดสุ่มบวกมีโอกาสเกิดขึ้นได้มากกว่าความผิดพลาดสุ่มลบ","ค่าที่อ่านได้ทุกตัวเลขมีความผิดพลาดเชิงระบบและความผิดพลาดสุ่ม"], a:0},
{q:"การคำนวณกำลังงานมีขีดจำกัดความผิดพลาด (limiting error) เท่ากับข้อใด ?",
 o:["ผลลบระหว่างขีดจำกัดความผิดพลาดของแรงดันและขีดจำกัดความผิดพลาดของกระแสไฟฟ้า","ผลคูณระหว่างขีดจำกัดความผิดพลาดของแรงดันและขีดจำกัดความผิดพลาดของกระแสไฟฟ้า","ผลบวกระหว่างขีดจำกัดความผิดพลาดของแรงดันและขีดจำกัดความผิดพลาดของกระแสไฟฟ้า","ผลหารระหว่างขีดจำกัดความผิดพลาดของแรงดันและขีดจำกัดความผิดพลาดของกระแสไฟฟ้า"], a:2},
{q:"ข้อใดคือความหมายของ \"เครื่องมือวัด\" ?",
 o:["อุปกรณ์ที่ใช้กำหนดหน่วยของปริมาณทางกายภาพ","อุปกรณ์ที่ใช้หาค่าปริมาณทางกายภาพ","อุปกรณ์ที่ใช้ระบุมาตรฐานของปริมาณทางกายภาพ","อุปกรณ์ที่ใช้สำหรับวิเคราะห์ปริมาณทางกายภาพ"], a:1},
{q:"สมการเส้นตรงที่ดีที่สุด (linear graph fitting) ของเครื่องมือวัดหรืออุปกรณ์วัด ไม่มีประโยชน์ในข้อใด ?",
 o:["ใช้คำนวณหาความไวของเครื่องมือวัดหรืออุปกรณ์วัดตลอดพิสัยหรือย่านการวัด","ใช้แทนความสัมพันธ์ระหว่างค่าที่อ่านได้และขนาดของปริมาณทางกายภาพที่ถูกวัด","ใช้ทำนายค่าที่อ่านได้หลังจากการกำหนดขนาดของปริมาณทางกายภาพ","ใช้คำนวณความน่าจะเป็นของค่าที่อ่านได้จากเครื่องมือวัดหรืออุปกรณ์วัด"], a:2},
{q:"ข้อใด ? ที่ใช้ในการนิยามหรือกำหนดความหมายหน่วยของปริมาณทางไฟฟ้า (หน่วยที่ใช้ในการวัด)",
 o:["ค่าแท้จริงของปริมาณทางไฟฟ้า","อุปกรณ์วัดหรือเครื่องมือวัด","มาตรฐานของคุณลักษณะสถิตและคุณลักษณะพลวัต","มาตรฐานของวัสดุ"], a:0},
{q:"จากรูปผลตอบสนองต่อไปนี้ (กราฟ step response ที่มีค่าพุ่งเกินเล็กน้อยแล้วเข้าสู่สถานะคงตัวที่ 1) ข้อใดไม่ถูกต้อง",
 o:["rise time ≈ 0.25 s (10%-90%)","Overshoot ≈ 10%","peak time ≈ 0.7 s","Settling time ≈ 1.5 s"], a:1},
{q:"ข้อใดไม่ใช่ความผิดพลาดเชิงระบบ (systematic error)",
 o:["Random error","Instrumental error","Observational error","Environmental error"], a:0},
{q:"ข้อใดคือเครื่องมือวัดประเภท first-order",
 o:["Displacement potentiometer","Mercury-in-glass thermometer","VOM","มีข้อถูกมากกว่า 1 ข้อ"], a:3},
{q:"กราฟเส้นตรงที่ดีที่สุด (linear graph fitting) มีคุณสมบัติที่ตรงกับข้อใด ?",
 o:["กราฟที่อยู่ห่างจากจุดทุกจุดด้วยผลบวกกำลังสองของระยะห่างที่น้อยที่สุด","กราฟที่อยู่ห่างจากจุดทุกจุดที่แทนคู่ลำดับด้วยระยะห่างที่น้อยที่สุด","กราฟที่เชื่อมต่อจุดทุกจุดที่แทนคู่ลำดับที่ใช้หาสมการเส้นตรงที่ดีที่สุด","กราฟที่อยู่ห่างจากจุดทุกจุดที่แทนคู่ลำดับด้วยระยะห่างที่เท่ากัน"], a:3},
{q:"ข้อใดกล่าวถูกต้อง",
 o:["ความแม่น (accuracy) คือ ระดับของความใกล้เคียงกันระหว่างค่าแท้จริงและค่าคาดหวัง","ความไว (sensitivity) คือ เส้นกราฟระหว่างค่าที่อ่านได้จากเครื่องมือวัดและขนาดของปริมาณทางกายภาพที่กำลังถูกวัด","ความเที่ยง (precision) คือ สภาพซ้ำกันได้ของค่าที่อ่านได้จากเครื่องมือวัด เมื่อนำเครื่องมือวัดไปวัดปริมาณทางกายภาพชนิดเดียวกันที่มีปริมาณต่างกันเล็กน้อย","ความแยกชัด (resolution) คือ การเปลี่ยนแปลงขนาดของปริมาณทางกายภาพที่กำลังถูกวัดน้อยที่สุดที่ทำให้เครื่องมือวัดเริ่มเปลี่ยนแปลงตัวเลขค่าที่อ่านได้"], a:3},
{q:"มาตรฐานทุติยภูมิ (secondary standard) มีจุดเด่นที่ตรงกับข้อใด ?",
 o:["เป็นมาตรฐานที่ประจำอยู่กับที่และไม่สามารถเคลื่อนย้ายได้","มีความถูกต้องหรือความแม่นเทียบเท่ากับมาตรฐานปฐมภูมิ","เป็นมาตรฐานที่ไม่จำเป็นต้องได้รับการสอบเทียบมาตรฐาน","ภาคอุตสาหกรรมสามารถเข้าถึงและเก็บรักษาไว้ได้"], a:3},
{q:"เครื่องมือวัดหรืออุปกรณ์วัดมีข้อมูลจำเพาะข้อใด ? ที่มีประโยชน์ถึงผู้ใช้งานมากที่สุด",
 o:["การเบี่ยงเบนมาตรฐานของความผิดพลาด (standard deviation of error)","ค่าเฉลี่ยเลขคณิตของความผิดพลาด (arithmetic mean of error)","ขีดจำกัดความผิดพลาด (limiting error)","การเบี่ยงเบนเฉลี่ยของความผิดพลาด (average deviation of error)"], a:3},
{q:"ปัจจัยในข้อใด ? ที่ทำให้เส้นโค้งการแจกแจงความผิดพลาด (error distribution curve) มีประโยชน์และมีความหมาย",
 o:["อุปกรณ์วัดหรือเครื่องมือวัดที่มีความเที่ยงสูงมาก","ความผิดพลาดสุ่มที่มีสาเหตุของการเกิดอย่างชัดเจน","อุปกรณ์วัดหรือเครื่องมือวัดที่ได้รับการสอบเทียบมาตรฐาน","จำนวนมากมายของค่าที่อ่านได้ที่เกิดจากการวัดซ้ำกันมากครั้ง"], a:3},
{q:"เครื่องมือวัดประเภท Second-order ที่มีค่า damping ratio (ζ) > 1 จะให้ผลตอบสนองทางพลวัตอย่างไร เมื่ออินพุตในการวัดมีการเปลี่ยนแปลงแบบขั้นบันได (step)",
 o:["ไม่มีค่าพุ่งเกินและค่าพุ่งต่ำ และใช้เวลาในการลู่เข้าสู่สถานะคงตัวเร็ว","ไม่มีค่าพุ่งเกินและค่าพุ่งต่ำ และใช้เวลาในการลู่เข้าสู่สถานะคงตัวช้า","มีค่าพุ่งเกินและค่าพุ่งต่ำ และใช้เวลาในการลู่เข้าสู่สถานะคงตัวเร็ว","มีค่าพุ่งเกินและค่าพุ่งต่ำ และใช้เวลาในการลู่เข้าสู่สถานะคงตัวช้า"], a:1},
{q:"ข้อใดกล่าวไม่ถูกต้องเกี่ยวกับการสอบเทียบเครื่องมือวัด (calibration)",

const LETTERS = ["ก","ข","ค","ง"];

let order = QUESTIONS.map((_,i)=>i);   // order[displayIndex] = question index
let current = 0;
let answers = {};   // displayIndex -> {choice, correct}
let finished = false;

const navGrid = document.getElementById('navGrid');
const quizArea = document.getElementById('quizArea');
const progressLabel = document.getElementById('progressLabel');
const scoreReadout = document.getElementById('scoreReadout');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startAttempt(doShuffle){
  order = doShuffle ? shuffle(QUESTIONS.map((_,i)=>i)) : QUESTIONS.map((_,i)=>i);
  current = 0;
  answers = {};
  finished = false;
  render();
}

function selectAnswer(displayIndex, choice){
  if(finished) return;
  const qIdx = order[displayIndex];
  const q = QUESTIONS[qIdx];
  answers[displayIndex] = {choice, correct: choice === q.a};
  render();
}

function goTo(displayIndex){
  current = displayIndex;
  render();
}

function finishAttempt(){
  finished = true;
  render();
  quizArea.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderNavGrid(){
  navGrid.innerHTML = '';
  order.forEach((qIdx, i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = i+1;
    if(i === current) btn.classList.add('current');
    const ans = answers[i];
    if(finished && ans){
      btn.classList.add(ans.correct ? 'answered-correct' : 'answered-wrong');
    } else if(finished && !ans){
      btn.classList.add('skipped');
    } else if(!finished && ans){
      btn.classList.add('skipped'); // amber = answered but not yet graded (still attempt mode) -> use as "answered" marker
      btn.style.color = 'var(--phosphor)';
      btn.style.borderColor = 'var(--phosphor-dim)';
      btn.style.background = 'rgba(78,222,152,0.1)';
    }
    btn.addEventListener('click', ()=>goTo(i));
    navGrid.appendChild(btn);
  });
  const answeredCount = Object.keys(answers).length;
  progressLabel.textContent = `${answeredCount} / ${QUESTIONS.length} answered`;
}

function renderScore(){
  const answeredCount = Object.keys(answers).length;
  const correctCount = Object.values(answers).filter(a=>a.correct).length;
  if(finished){
    scoreReadout.textContent = `${correctCount}/${QUESTIONS.length}`;
  } else {
    scoreReadout.textContent = `${answeredCount}/${QUESTIONS.length}`;
  }
}

function renderQuestion(){
  const qIdx = order[current];
  const q = QUESTIONS[qIdx];
  const ans = answers[current];
  const showResult = finished || !!ans;

  let optsHtml = '';
  q.o.forEach((opt, i)=>{
    let cls = 'opt';
    if(!finished){
      if(ans && ans.choice === i) cls += ' selected';
      if(ans) cls += ' disabled';
    } else {
      cls += ' disabled';
      if(i === q.a) cls += ' correct';
      else if(ans && ans.choice === i) cls += ' wrong';
    }
    optsHtml += `<div class="${cls}" onclick="selectAnswer(${current},${i})">
      <span class="tag">${LETTERS[i]}</span><span>${opt}</span>
    </div>`;
  });

  let feedbackHtml = '';
  if(ans && !finished){
    feedbackHtml = ans.correct
      ? `<div class="feedback ok">✓ ถูกต้อง</div>`
      : `<div class="feedback bad">✗ ยังไม่ถูก — คำตอบที่ถูกคือข้อ ${LETTERS[q.a]}</div>`;
  }

  quizArea.innerHTML = `
    <div class="screen">
      <div class="qmeta"><span>Q${current+1} / ${QUESTIONS.length}</span><span>${ans ? (finished ? (ans.correct?'CORRECT':'INCORRECT') : 'ANSWERED') : 'NOT ANSWERED'}</span></div>
      <div class="qtext">${q.q}</div>
      <div class="options">${optsHtml}</div>
      ${feedbackHtml}
      <div class="footer-nav">
        <button class="btn btn-ghost" id="prevBtn" ${current===0?'disabled':''}>← ข้อก่อนหน้า</button>
        <button class="btn btn-ghost" id="skipBtn">ข้ามข้อนี้ →</button>
        <button class="btn btn-solid" id="nextBtn" ${current===order.length-1?'disabled':''}>ข้อถัดไป →</button>
      </div>
    </div>
  `;

  document.getElementById('prevBtn').addEventListener('click', ()=>{ if(current>0) goTo(current-1); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ if(current<order.length-1) goTo(current+1); });
  document.getElementById('skipBtn').addEventListener('click', ()=>{ if(current<order.length-1) goTo(current+1); else quizArea.scrollIntoView(); });
}

function renderResultScreen(){
  const correctCount = Object.values(answers).filter(a=>a.correct).length;
  const total = QUESTIONS.length;
  const pct = Math.round((correctCount/total)*100);
  let reviewHtml = '';
  order.forEach((qIdx, i)=>{
    const q = QUESTIONS[qIdx];
    const ans = answers[i];
    const wrong = !ans || !ans.correct;
    reviewHtml += `<div class="review-item ${wrong?'wrong':''}">
      <div class="q">${i+1}. ${q.q}</div>
      <div class="a ${wrong?'bad':'ok'}">
        ${ans ? `คุณตอบ: ${LETTERS[ans.choice]}. ${q.o[ans.choice]}` : 'ไม่ได้ตอบ'}
        ${wrong ? ` · เฉลย: ${LETTERS[q.a]}. ${q.o[q.a]}` : ''}
      </div>
    </div>`;
  });

  quizArea.innerHTML = `
    <div class="screen">
      <div class="result">
        <div class="big">${correctCount} / ${total}</div>
        <div class="sub">คิดเป็น ${pct}% · กด "เริ่มทำใหม่" หรือ "สุ่มลำดับข้อใหม่" ด้านบนเพื่อลองอีกครั้ง</div>
      </div>
      <div class="review-list">${reviewHtml}</div>
    </div>
  `;
}

function render(){
  renderNavGrid();
  renderScore();
  if(finished){
    renderResultScreen();
  } else {
    renderQuestion();
  }
}

document.getElementById('shuffleBtn').addEventListener('click', ()=>startAttempt(true));
document.getElementById('resetBtn').addEventListener('click', ()=>startAttempt(false));
document.getElementById('finishBtn').addEventListener('click', finishAttempt);

startAttempt(false);
</script>
</body>
</html>
